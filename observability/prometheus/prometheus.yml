global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: vault
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    http_headers:
      X-Vault-Token:
        values: ["root"]
    static_configs:
      - targets: ["vault:8200"]
    relabel_configs:
      - target_label: service
        replacement: vault
