name: Validate

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'requests/**'
      - 'tests/**'
      - 'scripts/**'
      - 'evals/**'
      - 'observability/**'
      - '.cursor/hooks.json'
      - '.cursor/hooks/**'
  push:
    branches: [main]

jobs:
  terraform-fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform fmt check
        run: |
          terraform fmt -check -recursive terraform/
          terraform fmt -check -recursive requests/

      - name: Validate platform Terraform
        run: |
          cd terraform/platform
          terraform init -backend=false
          terraform validate

      - name: Validate platform-kind Terraform
        run: |
          cd terraform/platform-kind
          terraform init -backend=false
          terraform validate

      - name: Validate vault-service-onboard module
        run: |
          cd terraform/modules/vault-service-onboard/examples/minimal
          terraform init -backend=false
          terraform validate

      - name: Validate golden request
        run: |
          cd requests/PE-001-payments-api/03-terraform
          terraform init -backend=false
          terraform validate

      - name: Terraform test (module)
        run: |
          cd terraform/modules/vault-service-onboard
          terraform init -backend=false
          terraform test

  validate-change-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Extended validation (skip Vault-dependent checks)
        env:
          SKIP_VAULT_TESTS: 'true'
        run: |
          chmod +x scripts/*.sh
          ./scripts/validate-change.sh PE-001-payments-api || \
            (echo "Note: some checks SKIP without Vault/conftest/trivy" && \
             grep -q "PASS" requests/PE-001-payments-api/04-validation/report.md)

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Terratest (skip without Vault)
        env:
          SKIP_VAULT_TESTS: 'true'
        run: |
          cd tests
          go mod tidy
          go test -v -timeout 5m ./...

  phase-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check golden example phase order
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-phase-order.sh PE-001-payments-api

  factory-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic factory evals
        run: |
          chmod +x evals/score.sh scripts/*.sh
          ./evals/score.sh
